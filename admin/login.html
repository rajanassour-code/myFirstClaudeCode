<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Admin Login — Raja J. Nassour</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f172a;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .card {
      background: #1e293b;
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 16px;
      padding: 40px 36px;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 25px 50px rgba(0,0,0,.5);
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 28px;
    }
    .logo-badge {
      width: 40px; height: 40px;
      background: #6366f1;
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-weight: 900; color: #fff; font-size: .9rem;
    }
    .logo-text { line-height: 1.2; }
    .logo-title { font-size: .7rem; color: rgba(255,255,255,.35); font-weight: 600; letter-spacing: .08em; text-transform: uppercase; }
    .logo-name  { font-size: .95rem; color: #fff; font-weight: 700; }

    h1 { font-size: 1.3rem; font-weight: 800; color: #fff; margin-bottom: 6px; }
    .subtitle { font-size: .85rem; color: rgba(255,255,255,.4); margin-bottom: 28px; }

    label {
      display: block;
      font-size: .75rem; font-weight: 700;
      color: rgba(255,255,255,.4);
      letter-spacing: .06em; text-transform: uppercase;
      margin-bottom: 8px;
    }

    input[type=password] {
      width: 100%;
      padding: 12px 16px;
      background: rgba(255,255,255,.06);
      border: 1.5px solid rgba(255,255,255,.1);
      border-radius: 10px;
      color: #fff;
      font-size: .95rem;
      outline: none;
      transition: border-color .15s, box-shadow .15s;
      font-family: inherit;
    }
    input[type=password]:focus {
      border-color: #6366f1;
      box-shadow: 0 0 0 3px rgba(99,102,241,.2);
    }
    input[type=password]::placeholder { color: rgba(255,255,255,.2); }

    .error {
      display: none;
      align-items: center;
      gap: 8px;
      background: rgba(239,68,68,.12);
      border: 1px solid rgba(239,68,68,.25);
      border-radius: 8px;
      padding: 10px 14px;
      font-size: .82rem;
      color: #fca5a5;
      margin-bottom: 16px;
    }
    .error.show { display: flex; }

    button[type=submit] {
      width: 100%;
      margin-top: 16px;
      padding: 13px;
      background: #6366f1;
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: .9rem;
      font-weight: 700;
      cursor: pointer;
      transition: background .15s, transform .1s;
      font-family: inherit;
    }
    button[type=submit]:hover  { background: #4f46e5; }
    button[type=submit]:active { transform: scale(.98); }

    .back-link {
      display: block;
      text-align: center;
      margin-top: 18px;
      font-size: .8rem;
      color: rgba(255,255,255,.25);
      text-decoration: none;
      transition: color .15s;
    }
    .back-link:hover { color: rgba(255,255,255,.5); }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <div class="logo-badge">RJN</div>
      <div class="logo-text">
        <div class="logo-title">Back Office</div>
        <div class="logo-name">Content Manager</div>
      </div>
    </div>

    <h1>Sign in</h1>
    <p class="subtitle">Enter your admin password to continue.</p>

    <div class="error" id="err">
      <span>⚠️</span> Incorrect password. Please try again.
    </div>

    <form method="POST" action="/admin/login">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" placeholder="Enter password…" autofocus required/>
      <button type="submit">Sign in →</button>
    </form>

    <a href="/" class="back-link">← Back to website</a>
  </div>

  <script>
    // Show error if redirected with ?error=1
    if (window.location.search.includes('error=1')) {
      document.getElementById('err').classList.add('show');
      document.getElementById('password').focus();
    }
  </script>
</body>
</html>
