name: Build Live Assist Android demo APK
on:
  push:
    branches: [live-assist-android]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build debug APK
        id: build
        continue-on-error: true
        working-directory: sdk/android
        run: |
          set -o pipefail
          gradle :demo:assembleDebug --no-daemon --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/build.log"
      - name: Publish APK (or build log) to branch live-assist-android-build
        run: |
          mkdir out
          cp build.log out/ || true
          cp sdk/android/demo/build/outputs/apk/debug/*.apk out/CedarBank-LiveAssist-demo.apk 2>/dev/null || true
          printf '%s\n%s\n' "${{ steps.build.outcome }}" "$GITHUB_SHA" > out/RESULT.txt
          cd out
          git init -q && git checkout -q -b live-assist-android-build
          git config user.name "github-actions" && git config user.email "actions@github.com"
          git add -A && git commit -qm "Build ${GITHUB_SHA::7}: ${{ steps.build.outcome }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" live-assist-android-build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cedar-bank-demo-apk
          path: sdk/android/demo/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore
