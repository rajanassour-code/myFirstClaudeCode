name: Build Live Assist Flutter demo APK
on:
  push:
    branches: [live-assist-flutter]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Create Android project + patch
        working-directory: flutter/demo_bank
        run: |
          flutter --version | tee "$GITHUB_WORKSPACE/flutter-version.txt"
          flutter create --platforms=android --org com.rajanassour --project-name demo_bank .
          rm -rf test
          python3 ../tool/patch_android.py
          flutter pub get
      - name: Analyze
        continue-on-error: true
        working-directory: flutter
        run: |
          (cd live_assist && flutter pub get && flutter analyze --no-fatal-infos --no-fatal-warnings) 2>&1 | tee "$GITHUB_WORKSPACE/analyze.log"
          (cd demo_bank && flutter analyze --no-fatal-infos --no-fatal-warnings) 2>&1 | tee -a "$GITHUB_WORKSPACE/analyze.log"
      - name: Build release APK
        id: build
        continue-on-error: true
        working-directory: flutter/demo_bank
        run: |
          set -o pipefail
          flutter build apk --release 2>&1 | tee "$GITHUB_WORKSPACE/build.log"
      - name: Publish APK (or logs) to branch live-assist-flutter-build
        run: |
          mkdir out
          cp build.log analyze.log flutter-version.txt out/ 2>/dev/null || true
          cp flutter/demo_bank/build/app/outputs/flutter-apk/app-release.apk out/CedarBank-Flutter-demo.apk 2>/dev/null || true
          printf '%s\n%s\n' "${{ steps.build.outcome }}" "$GITHUB_SHA" > out/RESULT.txt
          cd out
          git init -q && git checkout -q -b live-assist-flutter-build
          git config user.name "github-actions" && git config user.email "actions@github.com"
          git add -A && git commit -qm "Build ${GITHUB_SHA::7}: ${{ steps.build.outcome }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" live-assist-flutter-build
